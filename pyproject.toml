[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer"
version = "0.1.0"
description = "Flag AI-sounding sentences in English engineering manuscripts against a pre-2020 human style profile"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.2",
    "pymupdf>=1.24",
    "reportlab>=4.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
llm = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
humanizer = "humanizer.cli:main"

[tool.setuptools.packages.find]
include = ["humanizer*"]

[tool.setuptools.package-data]
humanizer = ["data/*.yaml"]
